<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Yash Goel, full-stack developer</title>
  <desc id="desc">A navy banner with Yash Goel's name, a full-stack development subtitle, and a decorative code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" />
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#background)" />
  <rect width="1200" height="280" rx="20" fill="url(#grid)" />
  <rect x="52" y="52" width="48" height="5" rx="2.5" fill="url(#accent)" />
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="52" y="120" fill="#f8fafc" font-size="52" font-weight="700">Yash Goel</text>
    <text x="54" y="161" fill="#7dd3fc" font-size="23" font-weight="600">Full-stack developer</text>
    <text x="54" y="204" fill="#cbd5e1" font-size="18">Real-time apps. Thoughtful APIs. Problem solving.</text>
  </g>
  <rect x="748" y="46" width="400" height="188" rx="12" fill="#0b1220" stroke="#334155" />
  <path d="M 748 82 H 1148" stroke="#334155" />
  <circle cx="770" cy="64" r="5" fill="#fb7185" />
  <circle cx="788" cy="64" r="5" fill="#fbbf24" />
  <circle cx="806" cy="64" r="5" fill="#34d399" />
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="834" y="69" fill="#94a3b8" font-size="12">developer.json</text>
    <text x="772" y="110" fill="#cbd5e1">{</text>
    <text x="790" y="138"><tspan fill="#7dd3fc">"build"</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#a7f3d0">"full-stack apps"</tspan><tspan fill="#cbd5e1">,</tspan></text>
    <text x="790" y="166"><tspan fill="#7dd3fc">"explore"</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#a7f3d0">"real-time systems"</tspan><tspan fill="#cbd5e1">,</tspan></text>
    <text x="790" y="194"><tspan fill="#7dd3fc">"practice"</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#a7f3d0">"algorithms"</tspan></text>
    <text x="772" y="221" fill="#cbd5e1">}</text>
  </g>
  <rect x="52" y="253" width="1096" height="2" rx="1" fill="url(#accent)" opacity="0.65" />
</svg>
